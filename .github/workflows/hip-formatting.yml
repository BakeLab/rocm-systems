name: Clang format check
on:
  pull_request:
    types: [synchronize, opened]
    paths:
      - 'projects/hip/**'
      - 'projects/clr/**'
      - 'projects/hipother/**'
      - 'projects/hip-tests/**'

permissions:
  contents: read

concurrency:
  group: hip-formatting-${{ github.event_name }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt update && sudo apt install -y clang-format

      - name: Run clang-format-check
        id: clang-format
        run: |
          chmod +x .github/hooks/clang-format-check.sh
          ./.github/hooks/clang-format-check.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
